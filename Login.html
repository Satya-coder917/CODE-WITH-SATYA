Scr pl<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - FitCampus AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="login-container">

    <div class="login-box">

        <h1>FitCampus AI</h1>

        <h2>Welcome Back 👋</h2>

        <p>Login to continue your fitness journey.</p>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                🔐 Login
            </button>

        </form>

        <p class="register-text">
            Don't have an account?
            <a href="Register.html">Register</a>
        </p>

        <a href="index.html">
            ← Back to Home
        </a>

    </div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";


const firebaseConfig = {

    apiKey: "AIzaSyDyT1YJI16_H_LfxFHk0NT5Sj9dvRliebQ",

    authDomain:
        "fitcampus-ai-32e5d.firebaseapp.com",

    projectId:
        "fitcampus-ai-32e5d",

    storageBucket:
        "fitcampus-ai-32e5d.firebasestorage.app",

    messagingSenderId:
        "116058395606",

    appId:
        "1:116058395606:web:a88d985efb717fb358a77"

};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);


document
    .getElementById("loginForm")
    .addEventListener("submit", async (event) => {

        event.preventDefault();

        const email =
            document
                .getElementById("email")
                .value
                .trim();

        const password =
            document
                .getElementById("password")
                .value;


        try {

            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

            alert("✅ Login Successful!");

            window.location.href =
                "dashboard.html";

        } catch (error) {

            console.error(error);

            let message =
                "Login failed.";

            if (
                error.code ===
                "auth/invalid-credential"
            ) {

                message =
                    "❌ Email or password is incorrect.";

            } else if (
                error.code ===
                "auth/user-not-found"
            ) {

                message =
                    "❌ Account not found. Please register.";

            } else if (
                error.code ===
                "auth/wrong-password"
            ) {

                message =
                    "❌ Incorrect password.";

            } else if (
                error.code ===
                "auth/invalid-email"
            ) {

                message =
                    "❌ Please enter a valid email.";

            }

            alert(message);
        }

    });

</script>

</body>
</html>
